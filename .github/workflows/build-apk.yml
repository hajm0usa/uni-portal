name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION_CODE: ${{ github.run_number }}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: uni-portal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate release version
        id: version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release tags must look like v0.1.0.' >&2
            exit 1
          }
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        shell: bash
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/uni-portal-signing.jks
        run: |
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD secret}"
          umask 077
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon
      - name: Write update metadata
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['GITHUB_REF_NAME']}/app-release.apk"
          metadata = {
              'versionName': os.environ['APP_VERSION_NAME'],
              'versionCode': int(os.environ['APP_VERSION_CODE']),
              'apkUrl': url,
              'notes': '',
          }
          Path('latest.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
      - name: Create draft release for owner review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk latest.json \
            --verify-tag --draft --title "$GITHUB_REF_NAME" \
            --notes 'Review and publish manually. Back up the signing key before sharing.'
